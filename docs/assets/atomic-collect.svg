<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Atomic collect with sweeper retries and timing markers">
  <defs>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FF3B6B"/>
      <stop offset="100%" stop-color="#FF8A3B"/>
    </linearGradient>
    <radialGradient id="bgGrad3" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
    <marker id="arrowR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF3B6B"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="url(#bgGrad3)"/>

  <!-- title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;02</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">ATOMIC COLLECT &#8212; ONE TX, ZERO WINDOW</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">creator vault drains to the safe destination inside the same tx the bot would have to interleave with</text>
  </g>

  <!-- divider -->
  <g stroke="#1d2536" stroke-width="1">
    <line x1="40" y1="80" x2="1060" y2="80"/>
  </g>

  <!-- VAULT -->
  <g filter="url(#soft2)">
    <rect x="40" y="160" width="200" height="140" rx="14" fill="#11161f" stroke="#9945FF" stroke-width="1.8"/>
    <text x="140" y="194" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="16" font-weight="800">CREATOR VAULT</text>
    <text x="140" y="214" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11">PDA &#183; pump.fun</text>
    <text x="140" y="234" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">accrued creator fees</text>

    <!-- coin stack -->
    <g transform="translate(140,260)">
      <ellipse cx="-22" cy="0"  rx="14" ry="5" fill="#14F195" opacity="0.9"/>
      <ellipse cx="0"   cy="0"  rx="14" ry="5" fill="#14F195"/>
      <ellipse cx="22"  cy="0"  rx="14" ry="5" fill="#14F195" opacity="0.9"/>
      <ellipse cx="-11" cy="-8" rx="14" ry="5" fill="#14F195"/>
      <ellipse cx="11"  cy="-8" rx="14" ry="5" fill="#14F195"/>
      <ellipse cx="0"   cy="-16" rx="14" ry="5" fill="#14F195"/>
    </g>
  </g>

  <!-- SINGLE TX -->
  <g filter="url(#soft2)">
    <rect x="360" y="140" width="280" height="200" rx="14" fill="#0f1422" stroke="#14F195" stroke-width="1.8"/>
    <text x="500" y="172" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="14" font-weight="800" letter-spacing="3">SINGLE TX</text>
    <text x="500" y="190" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">one slot &#183; one signer &#183; one block</text>

    <rect x="380" y="206" width="240" height="42" rx="6" fill="#0b0d12" stroke="#9945FF" stroke-width="1"/>
    <text x="392" y="226" fill="#9945FF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">IX 1</text>
    <text x="426" y="226" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">collectCoinCreatorFee</text>
    <text x="426" y="240" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">pumpfun &#183; PDA &#8594; creator wallet</text>

    <rect x="380" y="256" width="240" height="42" rx="6" fill="#0b0d12" stroke="#00C2FF" stroke-width="1"/>
    <text x="392" y="276" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">IX 2</text>
    <text x="426" y="276" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">systemTransfer (drain)</text>
    <text x="426" y="290" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">creator wallet &#8594; destination</text>

    <text x="500" y="320" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">if IX2 fails, IX1 reverts &#8212; never settles</text>
  </g>

  <!-- DESTINATION -->
  <g filter="url(#soft2)">
    <rect x="780" y="160" width="220" height="140" rx="14" fill="#11161f" stroke="#00C2FF" stroke-width="1.8"/>
    <text x="890" y="194" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="16" font-weight="800">DESTINATION</text>
    <text x="890" y="214" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="11">safe wallet</text>
    <text x="890" y="234" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">private key, cold or hot</text>

    <g transform="translate(890,272)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#0b0d12" stroke="#14F195"/>
      <text x="0" y="4" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SOL SETTLED</text>
    </g>
  </g>

  <!-- vault -> tx -->
  <g>
    <path d="M 240 230 C 300 230, 300 230, 360 230" stroke="url(#goodGrad)" stroke-width="2.2" fill="none" marker-end="url(#arrowG2)"/>
    <circle r="5" fill="#14F195">
      <animateMotion dur="2.2s" repeatCount="indefinite"
        path="M 240 230 C 300 230, 300 230, 360 230"/>
    </circle>
  </g>

  <!-- tx -> destination -->
  <g>
    <path d="M 640 270 C 700 270, 720 230, 780 230" stroke="url(#goodGrad)" stroke-width="2.2" fill="none" marker-end="url(#arrowG2)"/>
    <circle r="5" fill="#14F195">
      <animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite"
        path="M 640 270 C 700 270, 720 230, 780 230"/>
    </circle>
  </g>

  <!-- SWEEPER section header -->
  <g font-family="ui-monospace, monospace">
    <text x="40" y="376" fill="#FF8A3B" font-size="11" letter-spacing="3">THREAT &#8212; SWEEPER BOT</text>
    <text x="40" y="392" fill="#5a6373" font-size="10">watching the leaked creator key. tries to drain on every tick. all attempts fail to interleave.</text>
  </g>

  <!-- SWEEPER box -->
  <g filter="url(#soft2)">
    <rect x="360" y="404" width="280" height="80" rx="12" fill="#150c11" stroke="#FF3B6B" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="500" y="430" text-anchor="middle" fill="#FF8A3B" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">SWEEPER BOT</text>
    <text x="500" y="450" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">poll &#8226; sign &#8226; submit &#8212; race to interleave</text>
    <g font-family="ui-monospace, monospace" font-size="11" font-weight="700">
      <text x="395" y="472" fill="#FF3B6B">&#10007; t+0ms</text>
      <text x="465" y="472" fill="#FF3B6B">&#10007; t+200ms</text>
      <text x="555" y="472" fill="#FF3B6B">&#10007; t+400ms</text>
    </g>
  </g>

  <!-- bot retry arrows -->
  <g>
    <path d="M 410 404 L 410 348" stroke="url(#badGrad)" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowR2)"/>
    <path d="M 500 404 L 500 348" stroke="url(#badGrad)" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowR2)"/>
    <path d="M 590 404 L 590 348" stroke="url(#badGrad)" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowR2)"/>

    <g>
      <circle cx="410" cy="348" r="9" fill="#0b0d12" stroke="#FF3B6B" stroke-width="1.6">
        <animate attributeName="r" values="6;12;6" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="410" y="352" text-anchor="middle" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&#10007;</text>
    </g>
    <g>
      <circle cx="500" cy="348" r="9" fill="#0b0d12" stroke="#FF3B6B" stroke-width="1.6">
        <animate attributeName="r" values="6;12;6" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="500" y="352" text-anchor="middle" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&#10007;</text>
    </g>
    <g>
      <circle cx="590" cy="348" r="9" fill="#0b0d12" stroke="#FF3B6B" stroke-width="1.6">
        <animate attributeName="r" values="6;12;6" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="590" y="352" text-anchor="middle" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&#10007;</text>
    </g>
  </g>

  <!-- vs the naive flow comparison -->
  <g font-family="ui-monospace, monospace" fill="#5a6373" font-size="10">
    <rect x="700" y="404" width="300" height="80" rx="10" fill="#0b0d12" stroke="#1d2536"/>
    <text x="715" y="424" fill="#9aa3b2" font-size="11">vs. naive two-tx collect</text>
    <text x="715" y="442">1. collect &#8594; SOL rests in creator wallet</text>
    <text x="715" y="458">2. (any tx here gets sandwiched / swept)</text>
    <text x="715" y="474">3. transfer &#8594; safe wallet (often empty)</text>
  </g>
</svg>
