<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Atomic collect: vault drains to destination in one tx, sweeper bot is locked out">
  <defs>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FF3B6B"/>
      <stop offset="100%" stop-color="#FF8A3B"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF3B6B"/>
    </marker>
  </defs>

  <rect width="900" height="360" fill="#0b0d12"/>

  <text x="450" y="34" text-anchor="middle" fill="#9aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">ATOMIC COLLECT &#8212; ONE TX, ZERO WINDOW</text>

  <g filter="url(#soft2)">
    <rect x="60" y="140" width="170" height="90" rx="12" fill="#11161f" stroke="#9945FF" stroke-width="1.6"/>
    <text x="145" y="172" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="15" font-weight="700">CREATOR VAULT</text>
    <text x="145" y="194" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">PDA &#183; accrued fees</text>
    <text x="145" y="212" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="13" font-weight="700">&#9679; &#9679; &#9679; SOL</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="350" y="120" width="200" height="130" rx="14" fill="#0f1422" stroke="#14F195" stroke-width="1.6"/>
    <text x="450" y="150" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">SINGLE TX</text>
    <rect x="370" y="166" width="160" height="28" rx="6" fill="#0b0d12" stroke="#9945FF" stroke-width="1"/>
    <text x="450" y="184" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">collectCoinCreatorFee</text>
    <rect x="370" y="200" width="160" height="28" rx="6" fill="#0b0d12" stroke="#00C2FF" stroke-width="1"/>
    <text x="450" y="218" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">transfer &#8594; destination</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="670" y="140" width="180" height="90" rx="12" fill="#11161f" stroke="#00C2FF" stroke-width="1.6"/>
    <text x="760" y="172" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="15" font-weight="700">DESTINATION</text>
    <text x="760" y="194" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">safe wallet</text>
    <text x="760" y="212" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="13" font-weight="700">SOL settled</text>
  </g>

  <g>
    <path d="M 230 185 C 290 185, 290 185, 350 185" stroke="url(#goodGrad)" stroke-width="2.2" fill="none" marker-end="url(#arrowG)"/>
    <path d="M 550 185 C 610 185, 610 185, 670 185" stroke="url(#goodGrad)" stroke-width="2.2" fill="none" marker-end="url(#arrowG)"/>

    <circle r="5" fill="#14F195">
      <animateMotion dur="2.2s" repeatCount="indefinite"
        path="M 230 185 C 290 185, 290 185, 350 185"/>
    </circle>
    <circle r="5" fill="#14F195">
      <animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite"
        path="M 550 185 C 610 185, 610 185, 670 185"/>
    </circle>
  </g>

  <g filter="url(#soft2)">
    <rect x="370" y="270" width="160" height="56" rx="10" fill="#150c11" stroke="#FF3B6B" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="450" y="290" text-anchor="middle" fill="#FF8A3B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">SWEEPER BOT</text>
    <text x="450" y="310" text-anchor="middle" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="14" font-weight="700">&#9587; locked out</text>
  </g>

  <g>
    <path d="M 450 270 L 450 232" stroke="url(#badGrad)" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowR)"/>
    <circle r="4" fill="#FF3B6B">
      <animateMotion dur="1.4s" repeatCount="indefinite"
        path="M 450 270 L 450 240"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(450,238)">
      <circle r="9" fill="#0b0d12" stroke="#FF3B6B" stroke-width="1.6">
        <animate attributeName="r" values="6;11;6" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="4" text-anchor="middle" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="11" font-weight="700">&#10007;</text>
    </g>
  </g>

  <text x="450" y="344" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="11">funds never rest in the leaky wallet &#8212; no slot between collect and drain</text>
</svg>
