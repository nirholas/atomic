<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-label="Tx size constraint: 1232 byte limit and why Jito bundles unblock it">
  <defs>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FF3B6B"/>
      <stop offset="100%" stop-color="#FF8A3B"/>
    </linearGradient>
    <radialGradient id="bg4" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="480" fill="url(#bg4)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;04</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">THE 1232-BYTE WALL &#8212; WHY ATOMIC IS A BUNDLE, NOT A TX</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">solana tx packets max at 1232 bytes; createV2 + funding ix overflows; jito bundles split it across two txs that land together</text>
  </g>

  <g stroke="#1d2536" stroke-width="1"><line x1="40" y1="80" x2="1060" y2="80"/></g>

  <!-- single-tx attempt -->
  <g font-family="ui-monospace, monospace">
    <text x="60" y="120" fill="#FF8A3B" font-size="12" letter-spacing="3">NAIVE &#8212; SINGLE TX</text>
    <text x="60" y="138" fill="#7a8190" font-size="10">funder transfer + creator createV2 in one tx (the obvious solution)</text>

    <!-- ruler -->
    <g transform="translate(60,160)">
      <rect x="0" y="0" width="980" height="44" rx="6" fill="#0e1320" stroke="#1d2536"/>
      <line x1="980" y1="0" x2="980" y2="44" stroke="#FF3B6B" stroke-width="2"/>
      <text x="990" y="14" fill="#FF3B6B" font-size="10" font-weight="700">1232 B</text>
      <text x="990" y="28" fill="#7a8190" font-size="9">packet cap</text>

      <!-- segments -->
      <rect x="0"   y="6" width="80"  height="32" rx="4" fill="#9945FF" opacity="0.85"/>
      <text x="40"  y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">hdr</text>

      <rect x="82"  y="6" width="180" height="32" rx="4" fill="#00C2FF" opacity="0.85"/>
      <text x="172" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">signers + accts</text>

      <rect x="264" y="6" width="160" height="32" rx="4" fill="#14F195" opacity="0.85"/>
      <text x="344" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">fund transfer ix</text>

      <rect x="426" y="6" width="540" height="32" rx="4" fill="url(#dangerGrad)"/>
      <text x="696" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">createV2 ix (19 accts &#183; metadata uri &#183; name/symbol &#183; buy ix)</text>

      <!-- overflow flag -->
      <rect x="960" y="6" width="60"  height="32" rx="4" fill="none" stroke="#FF3B6B" stroke-dasharray="3 3"/>
      <text x="990" y="26" text-anchor="middle" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="10" font-weight="700">OVERFLOW</text>
    </g>

    <text x="60" y="226" fill="#FF3B6B" font-family="ui-monospace, monospace" font-size="11">&#10007; rejected by the validator &#8212; tx will not be relayed</text>
  </g>

  <!-- bundle solution -->
  <g font-family="ui-monospace, monospace">
    <text x="60" y="276" fill="#14F195" font-size="12" letter-spacing="3">BUNDLE &#8212; TWO TXS, SAME SLOT</text>
    <text x="60" y="294" fill="#7a8190" font-size="10">tx1 funds creator, tx2 runs createV2 &#8212; both ride a shared blockhash and execute atomically</text>

    <!-- tx1 -->
    <g transform="translate(60,310)">
      <rect x="0" y="0" width="460" height="44" rx="6" fill="#0e1320" stroke="#9945FF"/>
      <rect x="6"  y="6" width="60"  height="32" rx="4" fill="#9945FF" opacity="0.85"/>
      <text x="36" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">hdr</text>
      <rect x="70" y="6" width="120" height="32" rx="4" fill="#00C2FF" opacity="0.85"/>
      <text x="130" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">signers + accts</text>
      <rect x="194" y="6" width="180" height="32" rx="4" fill="#14F195" opacity="0.85"/>
      <text x="284" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">fund transfer + tip</text>
      <text x="466" y="26" fill="#14F195" font-size="10" font-weight="700">~520 B &#10003;</text>
    </g>

    <!-- tx2 -->
    <g transform="translate(60,360)">
      <rect x="0" y="0" width="900" height="44" rx="6" fill="#0e1320" stroke="#00C2FF"/>
      <rect x="6"  y="6" width="60"  height="32" rx="4" fill="#9945FF" opacity="0.85"/>
      <text x="36" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">hdr</text>
      <rect x="70" y="6" width="180" height="32" rx="4" fill="#00C2FF" opacity="0.85"/>
      <text x="160" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">signers + 19 accts</text>
      <rect x="254" y="6" width="640" height="32" rx="4" fill="url(#okGrad)"/>
      <text x="574" y="26" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">createV2 ix &#183; metadata uri &#183; (optional buy)</text>
      <text x="906" y="26" fill="#14F195" font-size="10" font-weight="700">~1190 B &#10003;</text>
    </g>
  </g>

  <!-- side note -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#5a6373">
    <text x="60"  y="434">rule of thumb</text>
    <text x="60"  y="452" fill="#9aa3b2">  &#8226; any flow that touches createV2 or a heavy buy ix &#8594; bundle it</text>
    <text x="60"  y="468" fill="#9aa3b2">  &#8226; a single transfer + a single light ix &#8594; one tx is fine</text>
    <text x="640" y="434">scripts that hit the wall</text>
    <text x="640" y="452" fill="#9aa3b2">  fire-jito.js &#183; buy-jito.js &#183; consolidate.js</text>
    <text x="640" y="468" fill="#9aa3b2">  rescue-tokens.js &#183; distribute.js (batches)</text>
  </g>
</svg>
