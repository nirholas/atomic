<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-label="Consolidate flow: vault + creator + funder drain into destination atomically">
  <defs>
    <linearGradient id="cWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="cBg" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="cSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="url(#cBg)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;03</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">CONSOLIDATE &#8212; THREE SOURCES, ONE BUNDLE</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">collect creator vault + drain creator wallet + drain funder &#8594; destination, all in one Jito bundle</text>
  </g>

  <g stroke="#1d2536" stroke-width="1"><line x1="40" y1="80" x2="1060" y2="80"/></g>

  <!-- VAULT -->
  <g filter="url(#cSoft)">
    <rect x="60" y="120" width="200" height="80" rx="12" fill="#11161f" stroke="#9945FF" stroke-width="1.6"/>
    <text x="160" y="146" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">CREATOR VAULT</text>
    <text x="160" y="166" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11">PDA</text>
    <text x="160" y="184" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">collectCoinCreatorFee</text>
  </g>

  <!-- CREATOR -->
  <g filter="url(#cSoft)">
    <rect x="60" y="220" width="200" height="80" rx="12" fill="#11161f" stroke="#00C2FF" stroke-width="1.6"/>
    <text x="160" y="246" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">CREATOR WALLET</text>
    <text x="160" y="266" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="11">leaky / shared</text>
    <text x="160" y="284" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">systemTransfer (full balance &#8722; rent)</text>
  </g>

  <!-- FUNDER -->
  <g filter="url(#cSoft)">
    <rect x="60" y="320" width="200" height="80" rx="12" fill="#11161f" stroke="#14F195" stroke-width="1.6"/>
    <text x="160" y="346" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">FUNDER WALLET</text>
    <text x="160" y="366" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="11">private</text>
    <text x="160" y="384" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">systemTransfer (residual)</text>
  </g>

  <!-- wires into bundle -->
  <g>
    <path d="M 260 160 C 340 160, 360 220, 440 220" stroke="url(#cWire)" stroke-width="2" fill="none" marker-end="url(#cArrow)"/>
    <path d="M 260 260 C 340 260, 360 260, 440 260" stroke="url(#cWire)" stroke-width="2" fill="none" marker-end="url(#cArrow)"/>
    <path d="M 260 360 C 340 360, 360 300, 440 300" stroke="url(#cWire)" stroke-width="2" fill="none" marker-end="url(#cArrow)"/>

    <circle r="4" fill="#9945FF">
      <animateMotion dur="2.6s" repeatCount="indefinite"
        path="M 260 160 C 340 160, 360 220, 440 220"/>
    </circle>
    <circle r="4" fill="#00C2FF">
      <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite"
        path="M 260 260 C 340 260, 360 260, 440 260"/>
    </circle>
    <circle r="4" fill="#14F195">
      <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite"
        path="M 260 360 C 340 360, 360 300, 440 300"/>
    </circle>
  </g>

  <!-- BUNDLE -->
  <g filter="url(#cSoft)">
    <rect x="440" y="160" width="300" height="200" rx="14" fill="#0f1422" stroke="#14F195" stroke-width="1.8"/>
    <text x="590" y="190" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="14" font-weight="800" letter-spacing="3">CONSOLIDATE BUNDLE</text>

    <rect x="460" y="206" width="260" height="34" rx="6" fill="#0b0d12" stroke="#9945FF"/>
    <text x="472" y="226" fill="#9945FF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">IX A</text>
    <text x="500" y="226" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">collectCoinCreatorFee</text>
    <text x="500" y="238" fill="#5a6373" font-family="ui-monospace, monospace" font-size="9">PDA &#8594; creator wallet</text>

    <rect x="460" y="248" width="260" height="34" rx="6" fill="#0b0d12" stroke="#00C2FF"/>
    <text x="472" y="268" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">IX B</text>
    <text x="500" y="268" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">drain creator wallet</text>
    <text x="500" y="280" fill="#5a6373" font-family="ui-monospace, monospace" font-size="9">leaves only rent reserve</text>

    <rect x="460" y="290" width="260" height="34" rx="6" fill="#0b0d12" stroke="#14F195"/>
    <text x="472" y="310" fill="#14F195" font-family="ui-monospace, monospace" font-size="10" font-weight="700">IX C</text>
    <text x="500" y="310" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">drain funder wallet</text>
    <text x="500" y="322" fill="#5a6373" font-family="ui-monospace, monospace" font-size="9">residual SOL post-tip</text>

    <text x="590" y="346" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">one signer chain &#183; one slot &#183; reverts as a unit</text>
  </g>

  <!-- bundle -> dest -->
  <g>
    <path d="M 740 260 C 820 260, 820 260, 880 260" stroke="url(#cWire)" stroke-width="2.4" fill="none" marker-end="url(#cArrow)"/>
    <circle r="5" fill="#14F195">
      <animateMotion dur="1.6s" repeatCount="indefinite"
        path="M 740 260 C 820 260, 820 260, 880 260"/>
    </circle>
  </g>

  <!-- DESTINATION -->
  <g filter="url(#cSoft)">
    <rect x="880" y="200" width="180" height="120" rx="14" fill="#11161f" stroke="#00C2FF" stroke-width="1.8"/>
    <text x="970" y="234" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="15" font-weight="800">DESTINATION</text>
    <text x="970" y="254" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="11">safe wallet</text>
    <g transform="translate(970,290)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#0b0d12" stroke="#14F195"/>
      <text x="0" y="4" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SOL CONSOLIDATED</text>
    </g>
  </g>

  <!-- bottom annotations -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#5a6373">
    <text x="40" y="430">use cases</text>
    <text x="40" y="448" fill="#9aa3b2">  &#8226; coin ended &#8212; final sweep before retiring the keys</text>
    <text x="40" y="464" fill="#9aa3b2">  &#8226; suspected key compromise &#8212; close out before sweepers do</text>
    <text x="600" y="430">script</text>
    <text x="600" y="448" fill="#9aa3b2">  npm run consolidate</text>
    <text x="600" y="464" fill="#9aa3b2">  env: DESTINATION, FUNDER_SECRET, CREATOR_SECRET, JITO_TIP</text>
  </g>
</svg>
