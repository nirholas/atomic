<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-label="Sqrt-weighted USDC rewards distribution to holders">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="bg6" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="dSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="dArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="url(#bg6)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;06</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">DISTRIBUTE &#8212; SQRT-WEIGHTED USDC REWARDS</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">creator fees in &#8594; reward pool &#8594; each holder gets sqrt(balance) &#247; sum(sqrt(balance)) &#215; pool</text>
  </g>

  <g stroke="#1d2536" stroke-width="1"><line x1="40" y1="80" x2="1060" y2="80"/></g>

  <!-- LEFT: fee pool -->
  <g filter="url(#dSoft)">
    <rect x="40" y="130" width="220" height="120" rx="12" fill="#11161f" stroke="#9945FF" stroke-width="1.6"/>
    <text x="150" y="158" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">CREATOR FEES</text>
    <text x="150" y="178" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11">collected, in SOL/USDC</text>
    <text x="150" y="216" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="22" font-weight="800">$ 1,250</text>
    <text x="150" y="234" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">REWARD_PERCENT &#8594; pool</text>
  </g>

  <!-- formula -->
  <g filter="url(#dSoft)">
    <rect x="300" y="130" width="320" height="120" rx="12" fill="#0f1422" stroke="#00C2FF" stroke-width="1.6"/>
    <text x="460" y="158" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">WEIGHTING</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#e6e9ef">
      <text x="320" y="190">w&#8341; = &#8730;balance&#8341;</text>
      <text x="320" y="210">share&#8341; = w&#8341; / &#931; w&#8330;  &#215; pool</text>
      <text x="320" y="230" fill="#7a8190" font-size="10">filter holders below MIN_BPS &#8226; whales reweighted</text>
    </g>
  </g>

  <!-- RIGHT: holders -->
  <g filter="url(#dSoft)">
    <rect x="660" y="130" width="400" height="320" rx="12" fill="#11161f" stroke="#14F195" stroke-width="1.6"/>
    <text x="860" y="158" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">HOLDERS</text>

    <!-- bars -->
    <g font-family="ui-monospace, monospace" font-size="10" fill="#9aa3b2">
      <!-- whale -->
      <text x="676" y="190">whale &#183; 5.0%</text>
      <rect x="676" y="194" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="194" width="0"   height="14" rx="3" fill="url(#dGrad)">
        <animate attributeName="width" values="0;120" dur="1.4s" fill="freeze"/>
      </rect>
      <text x="804" y="205" fill="#14F195" font-weight="700">$ 280</text>

      <text x="676" y="226">holder A &#183; 1.2%</text>
      <rect x="676" y="230" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="230" width="0"   height="14" rx="3" fill="url(#dGrad)">
        <animate attributeName="width" values="0;88" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="804" y="241" fill="#14F195" font-weight="700">$ 175</text>

      <text x="676" y="262">holder B &#183; 0.8%</text>
      <rect x="676" y="266" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="266" width="0"   height="14" rx="3" fill="url(#dGrad)">
        <animate attributeName="width" values="0;72" dur="1.8s" fill="freeze"/>
      </rect>
      <text x="804" y="277" fill="#14F195" font-weight="700">$ 140</text>

      <text x="676" y="298">holder C &#183; 0.4%</text>
      <rect x="676" y="302" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="302" width="0"   height="14" rx="3" fill="url(#dGrad)">
        <animate attributeName="width" values="0;52" dur="2s" fill="freeze"/>
      </rect>
      <text x="804" y="313" fill="#14F195" font-weight="700">$ 98</text>

      <text x="676" y="334">holder D &#183; 0.2%</text>
      <rect x="676" y="338" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="338" width="0"   height="14" rx="3" fill="url(#dGrad)">
        <animate attributeName="width" values="0;36" dur="2.2s" fill="freeze"/>
      </rect>
      <text x="804" y="349" fill="#14F195" font-weight="700">$ 70</text>

      <!-- many small -->
      <text x="676" y="372">&#8230; long tail (n=84)</text>
      <rect x="676" y="376" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="376" width="0"   height="14" rx="3" fill="url(#dGrad)">
        <animate attributeName="width" values="0;108" dur="2.4s" fill="freeze"/>
      </rect>
      <text x="804" y="387" fill="#14F195" font-weight="700">$ 487</text>

      <!-- below threshold -->
      <text x="676" y="408" fill="#FF8A3B">below MIN_BPS &#215; 41</text>
      <rect x="676" y="412" width="120" height="14" rx="3" fill="#1d2536"/>
      <rect x="676" y="412" width="20"  height="14" rx="3" fill="#FF3B6B" opacity="0.6"/>
      <text x="804" y="423" fill="#FF8A3B" font-weight="700">skipped</text>
    </g>
  </g>

  <!-- pool -> formula -->
  <g>
    <path d="M 260 190 C 280 190, 280 190, 300 190" stroke="url(#dGrad)" stroke-width="2" fill="none" marker-end="url(#dArrow)"/>
    <circle r="4" fill="#14F195">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 260 190 C 280 190, 280 190, 300 190"/>
    </circle>
  </g>
  <!-- formula -> holders -->
  <g>
    <path d="M 620 190 C 640 190, 640 190, 660 190" stroke="url(#dGrad)" stroke-width="2" fill="none" marker-end="url(#dArrow)"/>
    <circle r="4" fill="#14F195">
      <animateMotion dur="2s" begin="0.4s" repeatCount="indefinite" path="M 620 190 C 640 190, 640 190, 660 190"/>
    </circle>
  </g>

  <!-- EMERGENCY pill -->
  <g transform="translate(150,310)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#150c11" stroke="#FF3B6B" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="0" y="4" text-anchor="middle" fill="#FF8A3B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="3">EMERGENCY MODE</text>
    <text x="0" y="36" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">collapse pool &#8594; one address</text>
  </g>

  <!-- footer -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#5a6373">
    <text x="40" y="445">env: MINT, REWARD_PERCENT, MIN_BPS &#183; script: src/distribute.js &#183; idempotent per epoch</text>
  </g>
</svg>
