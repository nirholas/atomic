<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="ATOMIC animated logo">
  <defs>
    <linearGradient id="atomicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="35%" stop-color="#00C2FF"/>
      <stop offset="70%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#9945FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#14F195" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00C2FF" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#9945FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="20%" cy="50%" r="80%">
      <stop offset="0%"  stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="atomGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#141a26" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" fill="url(#bgGrad)"/>
  <rect width="1100" height="320" fill="url(#grid)" opacity="0.6"/>

  <!-- starfield -->
  <g fill="#7a8190">
    <circle cx="40"   cy="50"  r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="120"  cy="280" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="980"  cy="40"  r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="220" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="520"  cy="22"  r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s"   repeatCount="indefinite"/></circle>
    <circle cx="700"  cy="300" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="260"  cy="20"  r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s"   repeatCount="indefinite"/></circle>
    <circle cx="860"  cy="280" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- atom -->
  <g transform="translate(160,160)" filter="url(#atomGlow)">
    <circle r="64" fill="url(#nucleusGrad)"/>
    <circle r="14" fill="#14F195"/>
    <circle r="14" fill="none" stroke="#0b0d12" stroke-width="2"/>
    <circle r="6"  fill="#0b0d12"/>

    <g>
      <ellipse rx="108" ry="38" fill="none" stroke="#9945FF" stroke-width="1.6" opacity="0.9"/>
      <circle r="6" cx="108" cy="0" fill="#9945FF">
        <animateMotion dur="3.2s" repeatCount="indefinite"
          path="M 108 0 A 108 38 0 1 1 -108 0 A 108 38 0 1 1 108 0 Z"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>

    <g transform="rotate(60)">
      <ellipse rx="108" ry="38" fill="none" stroke="#00C2FF" stroke-width="1.6" opacity="0.9"/>
      <circle r="6" cx="-108" cy="0" fill="#00C2FF">
        <animateMotion dur="2.6s" repeatCount="indefinite"
          path="M -108 0 A 108 38 0 1 0 108 0 A 108 38 0 1 0 -108 0 Z"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate"
        from="60" to="420" dur="5s" repeatCount="indefinite"/>
    </g>

    <g transform="rotate(120)">
      <ellipse rx="108" ry="38" fill="none" stroke="#14F195" stroke-width="1.6" opacity="0.9"/>
      <circle r="6" cx="108" cy="0" fill="#14F195">
        <animateMotion dur="3.8s" repeatCount="indefinite"
          path="M 108 0 A 108 38 0 1 1 -108 0 A 108 38 0 1 1 108 0 Z"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate"
        from="120" to="480" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- outer halo ring -->
    <circle r="130" fill="none" stroke="#1c2333" stroke-width="1"/>
    <circle r="130" fill="none" stroke="#14F195" stroke-width="1" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800" filter="url(#textGlow)">
    <text x="340" y="180" font-size="120" fill="url(#atomicGrad)" letter-spacing="18">ATOMIC</text>
  </g>
  <text x="340" y="180" font-size="120" fill="none" stroke="#14F195" stroke-width="0.6" letter-spacing="18" opacity="0.25"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800">ATOMIC
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="346" y="220" fill="#7a8190" font-size="14" letter-spacing="7">JITO &#183; PUMP.FUN V2 &#183; ALL-OR-NOTHING</text>
  </g>

  <!-- bottom feature strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5a6373">
    <text x="346" y="262">[ launch ]   [ collect ]   [ consolidate ]   [ buy via jupiter ]   [ rescue ]   [ distribute ]</text>
    <text x="346" y="282" fill="#3d4350">10 scripts &#183; 6 atomic bundles &#183; 0 sweeper windows</text>
  </g>

  <!-- top/bottom rules -->
  <g stroke="#1a1f2b" stroke-width="1">
    <line x1="0" y1="300" x2="1100" y2="300"/>
    <line x1="0" y1="20"  x2="1100" y2="20"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#14F195" stroke-width="1.5">
    <path d="M 16 16 L 16 32 M 16 16 L 32 16" fill="none"/>
    <path d="M 1084 16 L 1084 32 M 1084 16 L 1068 16" fill="none"/>
    <path d="M 16 304 L 16 288 M 16 304 L 32 304" fill="none"/>
    <path d="M 1084 304 L 1084 288 M 1084 304 L 1068 304" fill="none"/>
  </g>

  <!-- status pill -->
  <g transform="translate(960,40)">
    <rect x="-90" y="-14" width="120" height="28" rx="14" fill="#0f1422" stroke="#14F195" stroke-width="1"/>
    <circle cx="-72" cy="0" r="4" fill="#14F195">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="-60" y="4" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">LIVE ON MAINNET</text>
  </g>
</svg>
