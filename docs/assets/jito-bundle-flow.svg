<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Jito bundle flow with byte sizes, signers, and slot timing">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="bundleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1d2536"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <radialGradient id="bgGrad2" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6373"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="url(#bgGrad2)"/>

  <!-- title row -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;01</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">JITO BUNDLE &#8212; ATOMIC LAUNCH FLOW</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">funder + creator combined into a single all-or-nothing block engine decision</text>
  </g>

  <!-- step ribbon -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6373">
    <text x="60"   y="98">STEP 1</text>
    <text x="420"  y="98">STEP 2</text>
    <text x="720"  y="98">STEP 3</text>
    <text x="960"  y="98">STEP 4</text>
  </g>

  <g stroke="#1d2536" stroke-width="1">
    <line x1="40" y1="108" x2="1060" y2="108"/>
  </g>

  <!-- FUNDER -->
  <g filter="url(#soft)">
    <rect x="40"  y="140" width="220" height="120" rx="14" fill="#11161f" stroke="#9945FF" stroke-width="1.6"/>
    <text x="150" y="170" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="18" font-weight="800" letter-spacing="2">FUNDER</text>
    <text x="150" y="194" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11">signs Tx1</text>
    <text x="150" y="214" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">rent (~0.0024 SOL)</text>
    <text x="150" y="230" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">jito tip (0.005&#8211;0.02)</text>
    <text x="150" y="246" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">priority fee</text>
  </g>

  <!-- CREATOR -->
  <g filter="url(#soft)">
    <rect x="40"  y="280" width="220" height="120" rx="14" fill="#11161f" stroke="#00C2FF" stroke-width="1.6"/>
    <text x="150" y="310" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="18" font-weight="800" letter-spacing="2">CREATOR</text>
    <text x="150" y="334" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="11">signs Tx2</text>
    <text x="150" y="354" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">on-chain identity</text>
    <text x="150" y="370" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">may be public key</text>
    <text x="150" y="386" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">pays own fee</text>
  </g>

  <!-- combine wires -->
  <g>
    <path d="M 260 200 C 340 200, 340 250, 420 270" stroke="url(#wireGrad)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 260 340 C 340 340, 340 290, 420 290" stroke="url(#wireGrad)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <circle r="4" fill="#9945FF">
      <animateMotion dur="2.4s" repeatCount="indefinite"
        path="M 260 200 C 340 200, 340 250, 420 270"/>
    </circle>
    <circle r="4" fill="#00C2FF">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"
        path="M 260 340 C 340 340, 340 290, 420 290"/>
    </circle>
  </g>

  <!-- BUNDLE -->
  <g filter="url(#soft)">
    <rect x="420" y="160" width="280" height="220" rx="14" fill="url(#bundleGrad)" stroke="#14F195" stroke-width="1.8"/>
    <text x="560" y="190" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="14" font-weight="800" letter-spacing="3">JITO BUNDLE</text>
    <text x="560" y="210" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">shared blockhash &#183; ordered &#183; all-or-nothing</text>

    <!-- Tx1 -->
    <rect x="440" y="226" width="240" height="62" rx="8" fill="#0b0d12" stroke="#9945FF" stroke-width="1"/>
    <text x="452" y="246" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Tx1</text>
    <text x="478" y="246" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">funder pays rent + tip</text>
    <text x="452" y="264" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">accounts: 5   signers: 1   size: ~520 B</text>
    <text x="452" y="280" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">ix: systemTransfer &#215; 2</text>

    <!-- Tx2 -->
    <rect x="440" y="298" width="240" height="62" rx="8" fill="#0b0d12" stroke="#00C2FF" stroke-width="1"/>
    <text x="452" y="318" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Tx2</text>
    <text x="478" y="318" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">creator createV2 (+ dev buy)</text>
    <text x="452" y="336" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">accounts: 19  signers: 2   size: ~1190 B</text>
    <text x="452" y="352" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">ix: createV2 (+ buy)</text>

    <!-- pulsing border -->
    <rect x="432" y="172" width="256" height="196" rx="10" fill="none" stroke="#14F195" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bundle -> engine -->
  <g>
    <path d="M 700 270 C 750 270, 750 270, 800 270" stroke="url(#wireGrad)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
    <circle r="5" fill="#14F195">
      <animateMotion dur="1.6s" repeatCount="indefinite"
        path="M 700 270 C 750 270, 750 270, 800 270"/>
    </circle>
  </g>

  <!-- BLOCK ENGINE -->
  <g filter="url(#soft)">
    <rect x="800" y="200" width="180" height="140" rx="14" fill="#0f1422" stroke="#14F195" stroke-width="1.6"/>
    <text x="890" y="232" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">JITO BLOCK</text>
    <text x="890" y="250" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">ENGINE</text>
    <text x="890" y="276" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">tip auction &#183; same slot</text>
    <text x="890" y="294" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">no MEV interleave</text>
    <text x="890" y="318" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">accepted &#10003;</text>
    <circle cx="990" cy="216" r="4" fill="#14F195">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- engine -> chain -->
  <g>
    <path d="M 980 270 C 1010 270, 1010 270, 1040 270" stroke="#14F195" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- CHAIN tag -->
  <g font-family="ui-monospace, monospace">
    <text x="1054" y="262" fill="#14F195" font-size="11" font-weight="700">MAINNET</text>
    <text x="1054" y="276" fill="#7a8190" font-size="10">slot N</text>
  </g>

  <!-- slot timeline strip -->
  <g transform="translate(40,420)">
    <text x="0" y="-8" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">SLOT TIMELINE</text>
    <rect x="0" y="0" width="1020" height="44" rx="6" fill="#0e1320" stroke="#1d2536"/>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#5a6373">
      <line x1="0"   y1="0" x2="0"   y2="44" stroke="#1d2536"/>
      <line x1="170" y1="0" x2="170" y2="44" stroke="#1d2536"/>
      <line x1="340" y1="0" x2="340" y2="44" stroke="#1d2536"/>
      <line x1="510" y1="0" x2="510" y2="44" stroke="#1d2536"/>
      <line x1="680" y1="0" x2="680" y2="44" stroke="#1d2536"/>
      <line x1="850" y1="0" x2="850" y2="44" stroke="#1d2536"/>
      <text x="6"   y="14">N-2</text>
      <text x="176" y="14">N-1</text>
      <text x="346" y="14">N</text>
      <text x="516" y="14">N+1</text>
      <text x="686" y="14">N+2</text>
      <text x="856" y="14">N+3</text>
    </g>

    <!-- bundle window -->
    <rect x="340" y="20" width="170" height="18" rx="4" fill="#14F195" opacity="0.18"/>
    <rect x="340" y="20" width="170" height="18" rx="4" fill="none" stroke="#14F195" stroke-width="1"/>
    <text x="425" y="33" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#14F195" font-weight="700">BUNDLE LANDS</text>

    <!-- moving cursor -->
    <g>
      <line x1="0" y1="0" x2="0" y2="44" stroke="#00C2FF" stroke-width="1.5">
        <animate attributeName="x1" values="0;1020" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="0;1020" dur="6s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- footer hint -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#5a6373">
    <text x="40" y="500">no slot &#9474; no front-run window &#9474; if Tx2 fails, Tx1 is reverted by the engine</text>
  </g>
</svg>
