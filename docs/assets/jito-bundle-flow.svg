<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Jito bundle flow: funder + creator combine into one atomic bundle">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="bundleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1d2536"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
  </defs>

  <rect width="900" height="360" fill="#0b0d12"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6e9ef">
    <text x="450" y="34" text-anchor="middle" font-size="18" fill="#9aa3b2" letter-spacing="3">JITO BUNDLE &#8212; ATOMIC LAUNCH FLOW</text>
  </g>

  <g filter="url(#soft)">
    <rect x="50"  y="90" width="190" height="80" rx="12" fill="#11161f" stroke="#9945FF" stroke-width="1.4"/>
    <text x="145" y="120" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="16" font-weight="700">FUNDER</text>
    <text x="145" y="142" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">rent &#43; tip SOL</text>
    <text x="145" y="158" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">private / fresh key</text>

    <rect x="50"  y="200" width="190" height="80" rx="12" fill="#11161f" stroke="#00C2FF" stroke-width="1.4"/>
    <text x="145" y="230" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="16" font-weight="700">CREATOR</text>
    <text x="145" y="252" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">on-chain identity</text>
    <text x="145" y="268" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">signs createV2</text>
  </g>

  <g>
    <path d="M 240 130 C 320 130, 320 180, 400 180" stroke="url(#wireGrad)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 240 240 C 320 240, 320 200, 400 200" stroke="url(#wireGrad)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <circle r="4" fill="#14F195">
      <animateMotion dur="2.4s" repeatCount="indefinite"
        path="M 240 130 C 320 130, 320 180, 400 180"/>
    </circle>
    <circle r="4" fill="#00C2FF">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"
        path="M 240 240 C 320 240, 320 200, 400 200"/>
    </circle>
  </g>

  <g filter="url(#soft)">
    <rect x="400" y="120" width="220" height="140" rx="14" fill="url(#bundleGrad)" stroke="#14F195" stroke-width="1.6"/>
    <text x="510" y="150" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="2">JITO BUNDLE</text>

    <rect x="420" y="170" width="180" height="32" rx="6" fill="#0b0d12" stroke="#9945FF" stroke-width="1"/>
    <text x="510" y="190" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="12">Tx1 &#183; funder pays rent &#43; tip</text>

    <rect x="420" y="212" width="180" height="32" rx="6" fill="#0b0d12" stroke="#00C2FF" stroke-width="1"/>
    <text x="510" y="232" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="12">Tx2 &#183; creator createV2</text>

    <g>
      <rect x="412" y="162" width="196" height="92" rx="8" fill="none" stroke="#14F195" stroke-width="1" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g>
    <path d="M 620 190 C 700 190, 700 190, 780 190" stroke="url(#wireGrad)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
    <circle r="5" fill="#14F195">
      <animateMotion dur="1.6s" repeatCount="indefinite"
        path="M 620 190 C 700 190, 700 190, 780 190"/>
    </circle>
  </g>

  <g filter="url(#soft)">
    <rect x="720" y="150" width="140" height="80" rx="12" fill="#0f1422" stroke="#14F195" stroke-width="1.6"/>
    <text x="790" y="180" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700">ON-CHAIN</text>
    <text x="790" y="202" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">all-or-nothing</text>
    <text x="790" y="218" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="11">no MEV insert</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#5a6373">
    <text x="450" y="320" text-anchor="middle">shared blockhash &#8595; same slot &#8595; one block engine decision</text>
  </g>
</svg>
