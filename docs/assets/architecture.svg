<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="atomic toolkit architecture overview">
  <defs>
    <linearGradient id="aWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="bg8" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <pattern id="gridA" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#141a26" stroke-width="0.5"/>
    </pattern>
    <filter id="aSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
    <marker id="aArrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6373"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="url(#bg8)"/>
  <rect width="1200" height="640" fill="url(#gridA)" opacity="0.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;08</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">ARCHITECTURE &#8212; ATOMIC TOOLKIT</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">scripts &#183; libs &#183; tools &#183; external dependencies</text>
  </g>

  <g stroke="#1d2536" stroke-width="1"><line x1="40" y1="80" x2="1160" y2="80"/></g>

  <!-- swimlanes -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#5a6373">
    <text x="56" y="110" fill="#9aa3b2" font-size="12" letter-spacing="2">OPERATOR</text>
    <text x="56" y="220" fill="#9aa3b2" font-size="12" letter-spacing="2">CLI &amp; ENV</text>
    <text x="56" y="340" fill="#9aa3b2" font-size="12" letter-spacing="2">SCRIPTS</text>
    <text x="56" y="500" fill="#9aa3b2" font-size="12" letter-spacing="2">EXTERNAL</text>
  </g>

  <!-- operator nodes -->
  <g filter="url(#aSoft)">
    <rect x="180" y="92" width="240" height="40" rx="8" fill="#11161f" stroke="#9945FF"/>
    <text x="300" y="118" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="12" font-weight="700">operator (you)</text>
  </g>
  <g filter="url(#aSoft)">
    <rect x="440" y="92" width="240" height="40" rx="8" fill="#11161f" stroke="#00C2FF"/>
    <text x="560" y="118" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="12" font-weight="700">.env / shell env</text>
  </g>
  <g filter="url(#aSoft)">
    <rect x="700" y="92" width="240" height="40" rx="8" fill="#11161f" stroke="#14F195"/>
    <text x="820" y="118" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="12" font-weight="700">keypair files (mode 600)</text>
  </g>

  <!-- CLI/ENV strip -->
  <g filter="url(#aSoft)">
    <rect x="180" y="180" width="900" height="60" rx="10" fill="#0f1422" stroke="#1d2536"/>
    <text x="200" y="200" fill="#9aa3b2" font-family="ui-monospace, monospace" font-size="11" font-weight="700">npm run *</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#7a8190">
      <text x="200" y="220">metadata &#183; launch &#183; launch-single &#183; collect &#183; watch &#183; buy &#183; transfer-tokens &#183; consolidate &#183; distribute &#183; grind &#183; check-funding</text>
      <text x="200" y="234" fill="#5a6373">reads: RPC_URL, FUNDER_*, CREATOR_*, DESTINATION, JITO_TIP, NAME, SYMBOL, URI, &#8230;</text>
    </g>
  </g>

  <!-- scripts row 1 -->
  <g filter="url(#aSoft)">
    <rect x="180" y="290" width="180" height="80" rx="10" fill="#11161f" stroke="#9945FF"/>
    <text x="270" y="312" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">LAUNCH</text>
    <text x="270" y="332" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">fire-jito.js</text>
    <text x="270" y="348" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">fire-atomic-create.js</text>
    <text x="270" y="362" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">metadata.js</text>
  </g>

  <g filter="url(#aSoft)">
    <rect x="380" y="290" width="180" height="80" rx="10" fill="#11161f" stroke="#00C2FF"/>
    <text x="470" y="312" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">COLLECT</text>
    <text x="470" y="332" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">collect-jito.js</text>
    <text x="470" y="348" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">watch-collect.js</text>
    <text x="470" y="362" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">consolidate.js</text>
  </g>

  <g filter="url(#aSoft)">
    <rect x="580" y="290" width="180" height="80" rx="10" fill="#11161f" stroke="#14F195"/>
    <text x="670" y="312" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TRADE</text>
    <text x="670" y="332" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">buy-jito.js</text>
    <text x="670" y="348" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">rescue-tokens.js</text>
    <text x="670" y="362" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">distribute.js</text>
  </g>

  <g filter="url(#aSoft)">
    <rect x="780" y="290" width="180" height="80" rx="10" fill="#11161f" stroke="#9945FF"/>
    <text x="870" y="312" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">DIAGNOSE</text>
    <text x="870" y="332" text-anchor="middle" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">tools/check-pump-funding</text>
    <text x="870" y="348" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">grind.js</text>
    <text x="870" y="362" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">(sanity tools)</text>
  </g>

  <!-- libs row -->
  <g filter="url(#aSoft)">
    <rect x="180" y="400" width="780" height="70" rx="10" fill="#0f1422" stroke="#14F195"/>
    <text x="200" y="422" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">src/lib/ &#8212; typed helpers</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#9aa3b2">
      <text x="200" y="442">programs.ts: PUMPFUN_FEE_ACCOUNT, PUMP_FEE_RECIPIENTS, PUMP_FEE_RECIPIENT_SET, PUMPFUN_MIGRATION_AUTHORITY</text>
      <text x="200" y="458">funding-source.ts: detectSeededByPump (signature paging, oldest-first inbound classification)</text>
    </g>
  </g>

  <!-- external row -->
  <g filter="url(#aSoft)">
    <rect x="180" y="500" width="180" height="100" rx="10" fill="#11161f" stroke="#9945FF"/>
    <text x="270" y="524" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="12" font-weight="700">SOLANA RPC</text>
    <text x="270" y="544" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">helius / triton / public</text>
    <text x="270" y="560" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">read + simulate + send</text>
    <text x="270" y="578" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">RPC_URL</text>
  </g>

  <g filter="url(#aSoft)">
    <rect x="380" y="500" width="180" height="100" rx="10" fill="#11161f" stroke="#14F195"/>
    <text x="470" y="524" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="12" font-weight="700">JITO BLOCK ENGINE</text>
    <text x="470" y="544" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">sendBundle + tip auction</text>
    <text x="470" y="560" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">getTipAccounts</text>
    <text x="470" y="578" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">multi-region endpoints</text>
  </g>

  <g filter="url(#aSoft)">
    <rect x="580" y="500" width="180" height="100" rx="10" fill="#11161f" stroke="#00C2FF"/>
    <text x="670" y="524" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="12" font-weight="700">PUMP.FUN</text>
    <text x="670" y="544" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">createV2, collectCoinCreatorFee</text>
    <text x="670" y="560" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">IPFS metadata endpoint</text>
    <text x="670" y="578" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">V2 USDC quote (2026-05-21)</text>
  </g>

  <g filter="url(#aSoft)">
    <rect x="780" y="500" width="180" height="100" rx="10" fill="#11161f" stroke="#9945FF"/>
    <text x="870" y="524" text-anchor="middle" fill="#9945FF" font-family="ui-monospace, monospace" font-size="12" font-weight="700">JUPITER</text>
    <text x="870" y="544" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">aggregator quote + swap</text>
    <text x="870" y="560" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="10">used by buy-jito.js</text>
    <text x="870" y="578" text-anchor="middle" fill="#5a6373" font-family="ui-monospace, monospace" font-size="10">SDK-drift fallback</text>
  </g>

  <!-- wires -->
  <g stroke="url(#aWire)" stroke-width="1.6" fill="none">
    <path d="M 300 132 L 300 180" marker-end="url(#aArrow)"/>
    <path d="M 560 132 L 560 180" marker-end="url(#aArrow)"/>
    <path d="M 820 132 L 820 180" marker-end="url(#aArrow)"/>

    <path d="M 270 240 L 270 290" marker-end="url(#aArrow)"/>
    <path d="M 470 240 L 470 290" marker-end="url(#aArrow)"/>
    <path d="M 670 240 L 670 290" marker-end="url(#aArrow)"/>
    <path d="M 870 240 L 870 290" marker-end="url(#aArrow)"/>

    <path d="M 270 370 L 270 400" marker-end="url(#aArrow)"/>
    <path d="M 470 370 L 470 400" marker-end="url(#aArrow)"/>
    <path d="M 670 370 L 670 400" marker-end="url(#aArrow)"/>
    <path d="M 870 370 L 870 400" marker-end="url(#aArrow)"/>

    <path d="M 270 470 L 270 500" marker-end="url(#aArrow)"/>
    <path d="M 470 470 L 470 500" marker-end="url(#aArrow)"/>
    <path d="M 670 470 L 670 500" marker-end="url(#aArrow)"/>
    <path d="M 870 470 L 870 500" marker-end="url(#aArrow)"/>
  </g>

  <!-- side note panel -->
  <g filter="url(#aSoft)" transform="translate(1000,290)">
    <rect x="0" y="0" width="160" height="310" rx="10" fill="#0f1422" stroke="#1d2536"/>
    <text x="14" y="22" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">PROPERTIES</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#9aa3b2">
      <text x="14" y="44">&#8226; pure env-driven</text>
      <text x="14" y="62">&#8226; no shared state</text>
      <text x="14" y="80">&#8226; no daemon</text>
      <text x="14" y="98">&#8226; no DB</text>
      <text x="14" y="116">&#8226; idempotent retries</text>
      <text x="14" y="134">&#8226; mode 600 enforced</text>
      <text x="14" y="152">&#8226; .gitignore: *.json</text>
      <text x="14" y="170">&#8226; CommonJS runtime</text>
      <text x="14" y="188">&#8226; TS libs via tsx</text>
      <text x="14" y="206">&#8226; vitest on lib/</text>
      <text x="14" y="232" fill="#14F195">node &#8805; 20</text>
      <text x="14" y="250" fill="#14F195">solana &#8805; 1.18</text>
      <text x="14" y="268" fill="#14F195">jito-ts &#8805; latest</text>
    </g>
  </g>
</svg>
