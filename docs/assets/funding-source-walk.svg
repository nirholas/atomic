<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="detectSeededByPump walks signatures to find the first inbound SOL transfer">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="bg5" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#101627"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="fArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14F195"/>
    </marker>
  </defs>

  <rect width="1100" height="440" fill="url(#bg5)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40"  y="38" fill="#14F195" font-size="14" letter-spacing="3">FIG.&#160;05</text>
    <text x="120" y="38" fill="#e6e9ef" font-size="18" letter-spacing="2" font-weight="700">detectSeededByPump &#8212; FUNDING SOURCE WALK</text>
    <text x="120" y="56" fill="#7a8190" font-size="11">page signatures back to genesis, find the first inbound SOL, classify the sender against pump.fun's fee recipient set</text>
  </g>

  <g stroke="#1d2536" stroke-width="1"><line x1="40" y1="80" x2="1060" y2="80"/></g>

  <!-- timeline rail -->
  <line x1="80" y1="200" x2="1020" y2="200" stroke="#1d2536" stroke-width="2"/>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#5a6373">
    <text x="80"   y="222">oldest</text>
    <text x="1000" y="222">newest</text>
  </g>

  <!-- sig nodes -->
  <g>
    <!-- oldest = first inbound -->
    <g transform="translate(100,200)">
      <circle r="14" fill="#9945FF" stroke="#14F195" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" fill="#0b0d12" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SOL</text>
      <text x="0" y="-26" text-anchor="middle" fill="#14F195" font-family="ui-monospace, monospace" font-size="10" font-weight="700">first inbound</text>
      <text x="0" y="36" text-anchor="middle" fill="#7a8190" font-family="ui-monospace, monospace" font-size="9">from: PUMP fee recipient</text>
    </g>

    <!-- middle history dots -->
    <g fill="#1d2536">
      <circle cx="240" cy="200" r="6"/>
      <circle cx="320" cy="200" r="6"/>
      <circle cx="400" cy="200" r="6"/>
      <circle cx="480" cy="200" r="6"/>
      <circle cx="560" cy="200" r="6"/>
      <circle cx="640" cy="200" r="6"/>
      <circle cx="720" cy="200" r="6"/>
      <circle cx="800" cy="200" r="6"/>
      <circle cx="880" cy="200" r="6"/>
    </g>

    <!-- newest -->
    <circle cx="1000" cy="200" r="9" fill="#0b0d12" stroke="#00C2FF" stroke-width="2"/>
    <text x="1000" y="178" text-anchor="middle" fill="#00C2FF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">current sig</text>
  </g>

  <!-- walker cursor -->
  <g>
    <g>
      <polygon points="-10,-12 10,0 -10,12" fill="#14F195"/>
      <animateMotion dur="4s" repeatCount="indefinite"
        path="M 1000 200 L 100 200" rotate="auto"/>
    </g>
    <text font-family="ui-monospace, monospace" font-size="10" fill="#14F195">
      <textPath href="#walkPath">walking backwards via getSignaturesForAddress(before=&#8230;)</textPath>
    </text>
  </g>
  <path id="walkPath" d="M 100 168 L 1000 168" fill="none"/>

  <!-- classification box -->
  <g filter="url(#fSoft)" transform="translate(40,260)">
    <rect x="0" y="0" width="500" height="150" rx="12" fill="#0f1422" stroke="#9945FF" stroke-width="1.6"/>
    <text x="14" y="22" fill="#9945FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CLASSIFY FIRST FUNDER</text>
    <text x="14" y="44" fill="#e6e9ef" font-family="ui-monospace, monospace" font-size="11">if first.sender in</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#9aa3b2">
      <text x="30" y="62">&#8226; PUMP_FEE_RECIPIENT_SET</text>
      <text x="30" y="78">&#8226; PUMPFUN_MIGRATION_AUTHORITY</text>
      <text x="30" y="94">&#8226; PUMPFUN_FEE_ACCOUNT</text>
    </g>
    <text x="14" y="118" fill="#14F195" font-family="ui-monospace, monospace" font-size="13" font-weight="800">&#8594; SEEDED BY PUMP.FUN</text>
    <text x="14" y="136" fill="#FF8A3B" font-family="ui-monospace, monospace" font-size="11">otherwise &#8594; NOT SEEDED</text>
  </g>

  <!-- output box -->
  <g filter="url(#fSoft)" transform="translate(580,260)">
    <rect x="0" y="0" width="480" height="150" rx="12" fill="#11161f" stroke="#14F195" stroke-width="1.6"/>
    <text x="14" y="22" fill="#14F195" font-family="ui-monospace, monospace" font-size="11" font-weight="700">FundingSourceResult</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#9aa3b2">
      <text x="14" y="44">seeded:        true</text>
      <text x="14" y="60">firstFunder:   &lt;base58 pump fee recipient&gt;</text>
      <text x="14" y="76">amountLamports: 4_200_000</text>
      <text x="14" y="92">slot:          241_388_002</text>
      <text x="14" y="108">signature:     5z&#8230;Qa</text>
      <text x="14" y="124">classification: PUMP_FEE_RECIPIENT</text>
    </g>
  </g>

  <!-- bottom hint -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#5a6373">
    <text x="40" y="425">tool: npm run check-funding -- &lt;wallet&gt;   &#183;   library: src/lib/funding-source.ts   &#183;   constants: src/lib/programs.ts</text>
  </g>
</svg>
